spring:
  application:
    name: replyfit-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:replyfit}
    username: ${DB_USER:replyfit}
    password: ${DB_PASSWORD:replyfit}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: replyfit-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: co.replyfit.kafka.event

  lifecycle:
    # graceful shutdown 최대 대기. ECS 기본 stopTimeout(30s)보다 짧게 잡아
    # 강제 SIGKILL 전에 정리가 끝나도록 한다.
    timeout-per-shutdown-phase: 25s

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  # 롤링 배포로 컨테이너가 내려갈 때 처리 중이던 요청과 Kafka 메시지를 흘리지 않는다.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 태그 번호순 정렬 + 접힌 상태로 시작 — 훑어보기 쉽게
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none

replyfit:
  jwt:
    # 운영 환경에서는 반드시 환경변수로 주입 (최소 64바이트 권장)
    secret: ${JWT_SECRET:replyfit-dev-secret-key-please-change-in-production-0123456789abcdef}
    access-token-validity-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-validity-days: ${JWT_REFRESH_DAYS:14}
  ai:
    # openai | rule-based  (OPENAI_API_KEY 미설정 시 자동으로 rule-based 폴백)
    provider: ${REPLYFIT_AI_PROVIDER:openai}
    model: ${REPLYFIT_AI_MODEL:gpt-5-mini}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    demo: ${REPLYFIT_SEED_DEMO:true}
  data-retention:
    # 개인정보 최소 보관 원칙 — 기본 180일 경과 문의/리뷰 자동 삭제
    days: ${REPLYFIT_RETENTION_DAYS:180}

logging:
  level:
    co.replyfit: INFO
