spring:
  application:
    name: replyfit-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:replyfit}
    username: ${DB_USER:replyfit}
    password: ${DB_PASSWORD:replyfit}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: replyfit-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: co.replyfit.kafka.event

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

replyfit:
  jwt:
    # 운영 환경에서는 반드시 환경변수로 주입 (최소 64바이트 권장)
    secret: ${JWT_SECRET:replyfit-dev-secret-key-please-change-in-production-0123456789abcdef}
    access-token-validity-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-validity-days: ${JWT_REFRESH_DAYS:14}
  ai:
    # openai | rule-based  (OPENAI_API_KEY 미설정 시 자동으로 rule-based 폴백)
    provider: ${REPLYFIT_AI_PROVIDER:openai}
    model: ${REPLYFIT_AI_MODEL:gpt-5-mini}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    co.replyfit: INFO
