# 운영 전용 설정 — SPRING_PROFILES_ACTIVE=api,prod  또는  worker,prod 로 사용한다.
#
# 기본 프로필(application.yml)은 로컬 데모가 바로 되도록 관대하게 잡혀 있다.
# 그 관대함을 운영까지 들고 나가지 않으려고 분리한 프로필이므로,
# 여기서 끄는 항목은 전부 기본 프로필에서는 켜져 있다는 뜻이다.

spring:
  jpa:
    hibernate:
      # 기본 프로필에도 validate가 걸려 있다. 여기 한 번 더 두는 것은 방어선이다 —
      # 로컬 편의로 기본값이 update로 바뀌더라도 운영은 영향을 받지 않는다.
      ddl-auto: validate

# actuator를 애플리케이션 포트에서 분리한다.
# ALB 리스너는 8080만 대상으로 하고 9090은 ALB 보안 그룹 안에서만 열리므로,
# prometheus/metrics가 인터넷으로 나갈 경로 자체가 사라진다.
# (ALB 타깃 그룹의 헬스체크 포트만 9090으로 지정해 readiness를 본다)
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoint:
    health:
      show-details: never
      show-components: never

# 운영에서 API 스펙과 데모 계정 안내를 공개하지 않는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

replyfit:
  seed:
    demo: false

logging:
  # CloudWatch Logs Insights에서 필드 단위로 질의할 수 있도록 JSON으로 출력한다.
  # Spring Boot 3.4+ 내장 기능이라 별도 의존성이 필요 없다.
  structured:
    format:
      console: ecs
