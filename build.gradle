plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'co.replyfit'
version = '0.1.0'
description = '리플핏(ReplyFit) — 의류·잡화 셀러 CS 자동화 SaaS 백엔드'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'

    runtimeOnly 'org.postgresql:postgresql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // CSV 파싱 (문의·리뷰 업로드)
    implementation 'org.apache.commons:commons-csv:1.14.1'

    // AI 계층 — OpenAI 공식 Java SDK
    // victools를 통해 구버전 swagger-annotations(non-jakarta)가 딸려 와
    // springdoc의 2.2.4x와 동일 클래스명이 충돌(NoSuchMethodError: Schema.$dynamicRef)
    // → 제외하면 springdoc의 swagger-annotations-jakarta(동일 FQCN)가 대신 해석된다.
    implementation('com.openai:openai-java:4.52.0') {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    // OpenAPI (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // 스키마 마이그레이션 — ddl-auto 대신 명시적 버전 관리 (#57)
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 실제 PostgreSQL 컨테이너 기반 리포지토리 테스트 (검색 쿼리 회귀 방지)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
